[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memharmbench"
version = "8.4.3"
description = "Victim-centric evaluation of prompt injection in persistent-memory agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
memharmbench = "memharmbench_v84.cli:main"
memharmbench-v84 = "memharmbench_v84.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
