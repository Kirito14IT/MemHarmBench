<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" role="img" aria-labelledby="title"><title id="title">MemHarmBench exposure, native memory, and fresh-session evaluation</title><rect width="1240" height="590" rx="24" fill="#0E1929"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#7F96AE" stroke-width="1.6"/></marker></defs><text x="34" y="43" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">MEMHARMBENCH  /  EVALUATION FRAMEWORK</text><text x="34" y="86" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">A rule can outlive the session that introduced it.</text><text x="34" y="116" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Follow the input, retained rule, and later decision through a real agent&#x27;s native memory.</text><rect x="34" y="166" width="226" height="94" rx="16" fill="#493C25" stroke="#2B425C" stroke-width="1.5"/><text x="52" y="195" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">DPI · user message</text><text x="52" y="222" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Authorized-user channel</text><text x="52" y="244" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Unverified persistent rule</text><rect x="34" y="280" width="226" height="94" rx="16" fill="#163D40" stroke="#2B425C" stroke-width="1.5"/><text x="52" y="310" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">IPI · external artifact</text><text x="52" y="337" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Untrusted content</text><text x="52" y="359" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Embedded instruction</text><rect x="310" y="192" width="245" height="165" rx="16" fill="#15263D" stroke="#2B425C" stroke-width="1.5"/><text x="332" y="223" fill="#15B8A6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">01</text><text x="332" y="259" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Exposure session</text><text x="332" y="289" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">The agent encounters</text><text x="332" y="316" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">the adversarial rule.</text><rect x="615" y="192" width="245" height="165" rx="16" fill="#15263D" stroke="#2B425C" stroke-width="1.5"/><text x="637" y="223" fill="#15B8A6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">02</text><text x="637" y="259" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Native memory</text><text x="637" y="289" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Capture what the agent</text><text x="637" y="316" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">actually retains.</text><rect x="920" y="192" width="286" height="165" rx="16" fill="#15263D" stroke="#2B425C" stroke-width="1.5"/><text x="942" y="223" fill="#15B8A6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">03</text><text x="942" y="259" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Fresh-session task</text><text x="942" y="289" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Observe the later decision</text><text x="942" y="316" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">and its execution trace.</text><path d="M260 213H282V275H304M260 327H282V275" fill="none" stroke="#7F96AE" stroke-width="2.5"/><path d="M286 275L304 275" fill="none" stroke="#7F96AE" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M560 275L608 275" fill="none" stroke="#7F96AE" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M866 275L913 275" fill="none" stroke="#7F96AE" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="400" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">Original attack carrier removed before the trigger</text><rect x="34" y="435" width="521" height="107" rx="16" fill="#15263D" stroke="#2B425C" stroke-width="1.5"/><text x="54" y="466" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">WHOSE INTERESTS ARE AT STAKE?</text><text x="54" y="495" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">User  ·  Workspace / Project Owner</text><text x="54" y="521" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">External Stakeholder</text><rect x="615" y="435" width="245" height="107" rx="16" fill="#163D40" stroke="#2B425C" stroke-width="1.5"/><text x="635" y="464" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">MEMORY EVIDENCE</text><text x="635" y="496" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">PMIR</text><text x="635" y="522" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Complete-rule retention</text><rect x="920" y="435" width="286" height="107" rx="16" fill="#163D40" stroke="#2B425C" stroke-width="1.5"/><text x="940" y="464" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">DECISION + TRACE EVIDENCE</text><text x="940" y="496" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">C-ASR · UTDR · ATAR</text><text x="940" y="522" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Adoption · deviation · anomalies</text><text x="34" y="572" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400">Main evaluation uses PMIR-gated triggers. Ablations retain their own predeclared trigger schedules.</text></svg>
