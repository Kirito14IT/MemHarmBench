<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1010" viewBox="0 0 720 1010" role="img" aria-labelledby="title"><title id="title">Mobile overview of exposure, memory, and new-session evaluation</title><rect width="720" height="1010" rx="24" fill="#0E1929"/><text x="28" y="44" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">MEMHARMBENCH / EVALUATION</text><text x="28" y="90" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700">A rule can outlive its session.</text><text x="28" y="127" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Trace memory into the next decision.</text><rect x="28" y="163" width="324" height="130" rx="16" fill="#493C25" stroke="#2B425C" stroke-width="1.5"/><text x="48" y="199" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">DPI · user message</text><text x="48" y="235" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Authorized-user channel</text><text x="48" y="266" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Unverified rule</text><rect x="368" y="163" width="324" height="130" rx="16" fill="#163D40" stroke="#2B425C" stroke-width="1.5"/><text x="388" y="199" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">IPI · external artifact</text><text x="388" y="235" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Untrusted content</text><text x="388" y="266" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Embedded instruction</text><path d="M360 304v26m-9-9l9 9 9-9" fill="none" stroke="#7F96AE" stroke-width="3"/><rect x="28" y="342" width="664" height="120" rx="16" fill="#15263D" stroke="#2B425C" stroke-width="1.5"/><text x="49" y="380" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">01  Exposure session</text><text x="49" y="424" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">The agent encounters the adversarial rule.</text><path d="M360 472v26m-9-9l9 9 9-9" fill="none" stroke="#7F96AE" stroke-width="3"/><rect x="28" y="510" width="664" height="136" rx="16" fill="#15263D" stroke="#2B425C" stroke-width="1.5"/><text x="49" y="550" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">02  Native memory</text><text x="49" y="592" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Capture the complete retained rule.</text><text x="49" y="626" fill="#15B8A6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">PMIR · memory evidence</text><path d="M360 654v26m-9-9l9 9 9-9" fill="none" stroke="#7F96AE" stroke-width="3"/><text x="127" y="710" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Original attack carrier removed</text><rect x="28" y="736" width="664" height="136" rx="16" fill="#15263D" stroke="#2B425C" stroke-width="1.5"/><text x="49" y="776" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">03  Fresh-session task</text><text x="49" y="818" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">Observe the later decision and tool trace.</text><text x="49" y="852" fill="#15B8A6" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">C-ASR · UTDR · ATAR</text><text x="28" y="920" fill="#A6BCD4" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">WHOSE INTERESTS ARE AT STAKE?</text><text x="28" y="954" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">User · Workspace / Project Owner</text><text x="28" y="986" fill="#E6EFFC" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">External Stakeholder</text></svg>
