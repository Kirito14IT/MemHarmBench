name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install source and offline test tools
        run: python -m pip install -e . pytest
      - name: Verify frozen public inputs
        run: memharmbench validate
      - name: Run synthetic and offline tests
        run: python -m pytest tests -q
      - name: Check publication boundary
        run: python scripts/audit_release.py
      - name: Exercise offline walkthrough
        run: memharmbench demo
